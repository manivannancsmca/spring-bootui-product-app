server:
  port: 8080

spring:
  application:
    name: product-app

  datasource:
    url: jdbc:mysql://localhost:3306/productdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: productuser
    password: productpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  devtools:
    restart:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"            # BootUI reads actuator endpoints for its panels
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Product Application
    description: Enterprise Product Management API with BootUI
    version: 1.0.0

# BootUI Configuration
bootui:
  enabled: ON                   # Force ON so it works regardless of active profile
  path: /bootui                 # Console URL path
  show-banner: true             # Prints BootUI URL in startup logs
  startup:
    enabled: true               # Captures startup timeline data
    capacity: 4096
  monitoring:
    exclude-self: true          # Hide BootUI's own beans/metrics from panels
  mask-secrets: true            # Mask secret-like config values
  expose-values: MASKED         # MASKED | METADATA_ONLY | FULL
  read-only: false              # Allow mutating actions (cache clear, logger changes, etc.)